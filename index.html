<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrieria Tucuman PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0F4C5C',dark:'#1A2A33',accent:'#5FA8D3',bgsoft:'#E8F4F8',urgent:'#E36414'},fontFamily:{mont:['Montserrat'],sans:['Open Sans']}}}}</script>
</head>
<body class="bg-bgsoft font-sans text-dark min-h-screen">
<header class="bg-dark text-white p-4 sticky top-0"><h1 class="font-mont text-xl">Vidrieria Tucuman <span class="text-accent">PRO</span></h1><p class="text-[11px] opacity-60">Reposición de vidrios por paño, con metros cuadrados y urgencias</p></header>
<main class="max-w-[720px] mx-auto p-4 space-y-4">
<section class="bg-white rounded-[18px] p-5 border shadow-sm">
<h2 class="font-mont text-primary text-sm mb-3">NUEVO PAÑO</h2>
<div class="grid grid-cols-2 gap-3">
<input id="cliente" placeholder="Cliente / Obra" class="col-span-2 border rounded-xl p-3 text-sm">
<input id="ancho" type="number" placeholder="Ancho (cm)" class="border rounded-xl p-3 text-sm">
<input id="alto" type="number" placeholder="Alto (cm)" class="border rounded-xl p-3 text-sm">
<select id="vidrio" class="col-span-2 border rounded-xl p-3 text-sm bg-white"><option value="8500">Float 4mm - $8.500 /m²</option><option value="11500">Float 6mm - $11.500 /m²</option><option value="18500">Laminado 3+3 - $18.500 /m²</option><option value="19500">Templado 6mm - $19.500 /m²</option><option value="25000">DVH - $25.000 /m²</option></select>
<select id="urgencia" class="col-span-2 border rounded-xl p-3 text-sm bg-white font-semibold"><option value="1">Normal 24/48hs</option><option value="1.3">Urgente HOY +30%</option><option value="1.6">Muy urgente 4hs +60%</option></select>
</div>
<div class="mt-4 bg-dark rounded-2xl p-4 flex justify-between text-white"><div><p class="text-[10px] text-accent tracking-widest">M²</p><p id="outM2" class="font-mont text-2xl">0.00 m²</p><p id="outMed" class="text-[11px] opacity-50">0 x 0 cm</p></div><div class="text-right"><p id="outVidrio" class="text-[10px] text-accent">Float 4mm</p><p id="outTotal" class="font-mont text-2xl">$0</p><p id="outUrg" class="hidden text-[10px] bg-urgent px-2 py-1 rounded-full mt-1"></p></div></div>
<button id="btnAdd" class="w-full mt-4 bg-primary text-white font-mont py-3.5 rounded-xl">AGREGAR PAÑO</button>
</section>
<section><h2 class="font-mont text-sm">PAÑOS CARGADOS (<span id="count">0</span>)</h2><div id="lista" class="space-y-2 mt-2"></div><div id="resumen" class="hidden mt-3 bg-primary rounded-2xl p-4 text-white"><div class="flex justify-between text-sm"><span>Total m²</span><b id="rM2">0</b></div><div class="flex justify-between text-sm"><span>Paños</span><b id="rCant">0</b></div><div class="flex justify-between font-mont text-xl mt-2 pt-3 border-t border-white/20"><span>TOTAL</span><span id="rTotal">$0</span></div></div></section>
</main>
<script>
let panos=JSON.parse(localStorage.getItem('panos_v1')||'[]');
const $=id=>document.getElementById(id);
const names=["Float 4mm","Float 6mm","Laminado 3+3","Templado 6mm","DVH"];
function calc(){let an=parseFloat($('ancho').value)||0,al=parseFloat($('alto').value)||0,idx=$('vidrio').selectedIndex,pM2=parseFloat($('vidrio').value),urg=parseFloat($('urgencia').value),m2=an*al/10000,tot=Math.round(m2*pM2*urg);$('outM2').innerText=m2.toFixed(2)+' m²';$('outMed').innerText=an+' x '+al+' cm';$('outTotal').innerText='$'+tot.toLocaleString('es-AR');$('outVidrio').innerText=names[idx];let t=$('outUrg');if(urg>1){t.classList.remove('hidden');t.innerText=$('urgencia').options[$('urgencia').selectedIndex].text;}else t.classList.add('hidden');return{an,al,m2,tot};}
['ancho','alto'].forEach(i=>$(i).addEventListener('input',calc));['vidrio','urgencia'].forEach(i=>$(i).addEventListener('change',calc));
$('btnAdd').addEventListener('click',()=>{let c=calc();if(!c.an||!c.al){alert('Cargá ancho y alto');return;}panos.push({cliente:$('cliente').value||'Obra',an:c.an,al:c.al,m2:c.m2,vidrio:names[$('vidrio').selectedIndex],urgTxt:$('urgencia').options[$('urgencia').selectedIndex].text,total:c.tot});localStorage.setItem('panos_v1',JSON.stringify(panos));render();$('ancho').value='';$('alto').value='';calc();});
function render(){let h='',tm2=0,tt=0;panos.forEach((p,i)=>{tm2+=p.m2;tt+=p.total;h+=`<div class="bg-white border rounded-xl p-3 flex justify-between text-sm"><div><b class="font-mont">${p.cliente}</b><br>${p.vidrio} ${p.an}x${p.al}cm (${p.m2.toFixed(2)}m²)<br><span class="text-urgent text-xs">${p.urgTxt}</span></div><div class="text-right"><b class="text-primary">$${p.total.toLocaleString('es-AR')}</b><br><button onclick="panos.splice(${i},1);localStorage.setItem('panos_v1',JSON.stringify(panos));render()" class="text-xs bg-bgsoft px-2 py-1 rounded-lg mt-1">Eliminar</button></div></div>`;});$('lista').innerHTML=h||'<p class="text-sm opacity-40">Sin paños.</p>';$('count').innerText=panos.length;if(panos.length){$('resumen').classList.remove('hidden');$('rM2').innerText=tm2.toFixed(2)+' m²';$('rCant').innerText=panos.length;$('rTotal').innerText='$'+tt.toLocaleString('es-AR');}else $('resumen').classList.add('hidden');}
render();calc();
</script>
</body>
</html>
