<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrieria Tucuman Pro - FINAL v16 Branding</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brandBlack:'#1A2A33',brandGreen:'#0FAC5C',brandBlue:'#5FA8D3',brandLight:'#E8F4F8',brandOrange:'#E36414'}}}}</script>
<style>body{font-family:'Open Sans',sans-serif}h1,h2,h3,.mont{font-family:'Montserrat',sans-serif}</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#E8F4F8] min-h-screen flex flex-col">
<div id="app"></div>
<script>
const VIDRIOS=[{id:'float4',nombre:'Float 4mm',precio:8500},{id:'float6',nombre:'Float 6mm',precio:11500},{id:'laminado',nombre:'Laminado 3+3 Seguridad',precio:18500},{id:'templado',nombre:'Templado 6mm Seguridad',precio:19500},{id:'dvh',nombre:'DVH 4/9/4',precio:25000}];
const LOCALIDADES=['San Miguel de Tucuman','Tafi Viejo','Yerba Buena','Banda del Rio Sali','Las Talitas','Lules'];
const ESTADOS=['Medicion pendiente','Presupuestado','Aprobado','En taller','Instalado','Cobrado'];
const calcM2=function(a,b){return (parseFloat(a)||0)*(parseFloat(b)||0)/10000;};
function aviso150(an,al){var anN=Number(an)||0;var alN=Number(al)||0;if(anN>150||alN>150){return '<div class="bg-orange-50 border-l-4 border-[#E36414] text-[#1A2A33] p-3 mb-3 rounded mont font-bold text-sm"><i class="fa-solid fa-triangle-exclamation mr-2 text-[#E36414]"></i>Atencion: medida mayor a 150cm requiere templado.</div>';}return '';}
var presupuestos=JSON.parse(localStorage.getItem('vtuc')||'[]');
var form={cliente:'',localidad:LOCALIDADES[0],vidrio:VIDRIOS[0].id,ancho:'',alto:'',estado:ESTADOS[0]};
function render(){
 var app=document.getElementById('app');
 var totalM2=calcM2(form.ancho,form.alto);
 var vidSel=VIDRIOS.find(function(v){return v.id===form.vidrio;})||VIDRIOS[0];
 var totalPrecio=Math.round(totalM2*vidSel.precio);
 var optsLoc='';for(var i=0;i<LOCALIDADES.length;i++){var l=LOCALIDADES[i];optsLoc+='<option'+(form.localidad===l?' selected':'')+'>'+l+'</option>';}
 var optsVid='';for(var j=0;j<VIDRIOS.length;j++){var v=VIDRIOS[j];optsVid+='<option value="'+v.id+'"'+(form.vidrio===v.id?' selected':'')+'>'+v.nombre+'</option>';}
 var optsEst='';for(var k=0;k<ESTADOS.length;k++){var e=ESTADOS[k];optsEst+='<option'+(form.estado===e?' selected':'')+'>'+e+'</option>';}
 var lista='';
 if(presupuestos.length===0){lista='<div class="bg-white rounded-2xl p-8 text-center border border-dashed border-[#5FA8D3]/40"><p class="text-[#1A2A33]/60 mont">No hay presupuestos aun</p></div>';}
 else{for(var idx=0;idx<presupuestos.length;idx++){var p=presupuestos[idx];lista+='<div class="bg-white rounded-2xl shadow-sm border border-[#5FA8D3]/20 p-4 mb-3"><div class="flex justify-between"><div><p class="mont font-bold text-[#1A2A33]">'+p.cliente+'</p><p class="text-xs text-[#1A2A33]/60">'+p.localidad+' - '+p.vidrioNombre+'</p><p class="text-xs text-[#1A2A33]/60">'+p.ancho+'x'+p.alto+'cm - '+p.m2+' m2</p></div><div class="text-right"><p class="font-extrabold text-[#0FAC5C]">$'+p.total.toLocaleString('es-AR')+'</p><span class="bg-[#5FA8D3]/20 text-[#1A2A33] text-[10px] font-bold px-2 py-1 rounded-full mont">'+p.estado+'</span></div></div><div class="flex gap-2 mt-3"><button onclick="borrar('+idx+')" class="flex-1 bg-[#E8F4F8] text-[#1A2A33] text-xs font-bold py-2 rounded-lg">Borrar</button><a href="https://wa.me/5493810000000?text=Presupuesto" target="_blank" class="flex-1 bg-[#1A2A33] text-white text-xs font-bold py-2 rounded-lg text-center">WhatsApp</a></div></div>';}}
 var headerHTML='<header class="bg-[#1A2A33] text-white shadow-lg"><div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center"><h1 class="mont font-extrabold text-xl"><i class="fa-solid fa-gem mr-2 text-[#0FAC5C]"></i>Vidrieria Tucuman <span class="text-[#5FA8D3]">PRO</span></h1><span class="bg-[#0FAC5C] text-[#1A2A33] text-xs font-bold px-3 py-1 rounded-full mont">FINAL v16</span></div></header>';
 var formHTML='<section class="bg-white rounded-2xl shadow-sm border border-[#5FA8D3]/20 p-5"><h2 class="mont font-bold text-[#1A2A33] text-lg mb-4"><i class="fa-solid fa-plus mr-2 text-[#0FAC5C]"></i>Nuevo Presupuesto</h2>'+aviso150(form.ancho,form.alto)+'<div class="space-y-4"><div><label class="text-sm font-semibold text-[#1A2A33]">Cliente</label><input id="cliente" value="'+form.cliente+'" class="w-full mt-1 border border-[#5FA8D3]/30 rounded-lg px-3 py-2 bg-[#E8F4F8]/50" placeholder="Nombre"></div><div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-semibold text-[#1A2A33]">Localidad</label><select id="localidad" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsLoc+'</select></div><div><label class="text-sm font-semibold text-[#1A2A33]">Vidrio</label><select id="vidrio" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsVid+'</select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-semibold text-[#1A2A33]">Ancho (cm)</label><input id="ancho" type="number" value="'+form.ancho+'" class="w-full mt-1 border rounded-lg px-3 py-2"></div><div><label class="text-sm font-semibold text-[#1A2A33]">Alto (cm)</label><input id="alto" type="number" value="'+form.alto+'" class="w-full mt-1 border rounded-lg px-3 py-2"></div></div><div class="bg-[#1A2A33] text-white rounded-xl p-4 flex justify-between items-center"><div><p class="text-xs text-[#5FA8D3] mont">TOTAL</p><p class="font-bold text-lg">'+totalM2.toFixed(2)+' m2</p></div><div class="text-right"><p class="text-xs text-[#5FA8D3] mont">'+vidSel.nombre+'</p><p class="font-extrabold text-xl text-[#0FAC5C]">$'+totalPrecio.toLocaleString('es-AR')+'</p></div></div><div><label class="text-sm font-semibold text-[#1A2A33]">Estado</label><select id="estado" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsEst+'</select></div><button id="btnGuardar" class="w-full bg-[#0FAC5C] hover:bg-[#0FAC5C]/90 text-[#1A2A33] mont font-bold py-3 rounded-xl shadow-md">Guardar Presupuesto</button></div></section>';
 var listHTML='<section class="space-y-4"><h2 class="mont font-bold text-[#1A2A33] text-lg">Presupuestos ('+presupuestos.length+')</h2>'+lista+'</section>';
 app.innerHTML=headerHTML+'<main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 grid md:grid-cols-2 gap-6">'+formHTML+listHTML+'</main><footer class="bg-[#1A2A33] text-[#5FA8D3]/60 text-center text-xs py-3 mont">Vidrieria Tucuman PRO - Colores Briefing #1A2A33 #0FAC5C #5FA8D3 #E8F4F8 #E36414</footer>';
 document.getElementById('cliente').addEventListener('input',function(e){form.cliente=e.target.value;render();});
 document.getElementById('localidad').addEventListener('change',function(e){form.localidad=e.target.value;render();});
 document.getElementById('vidrio').addEventListener('change',function(e){form.vidrio=e.target.value;render();});
 document.getElementById('ancho').addEventListener('input',function(e){form.ancho=e.target.value;render();});
 document.getElementById('alto').addEventListener('input',function(e){form.alto=e.target.value;render();});
 document.getElementById('estado').addEventListener('change',function(e){form.estado=e.target.value;});
 document.getElementById('btnGuardar').addEventListener('click',guardar);
}
function guardar(){if(!form.cliente||!form.ancho||!form.alto){alert('Completa cliente, ancho y alto');return;}var vidSel=VIDRIOS.find(function(v){return v.id===form.vidrio;});var m2=calcM2(form.ancho,form.alto);presupuestos.unshift({cliente:form.cliente,localidad:form.localidad,vidrio:form.vidrio,vidrioNombre:vidSel.nombre,ancho:form.ancho,alto:form.alto,m2:m2.toFixed(2),total:Math.round(m2*vidSel.precio),estado:form.estado});localStorage.setItem('vtuc',JSON.stringify(presupuestos));form.cliente='';form.ancho='';form.alto='';render();}
function borrar(i){if(confirm('Borrar?')){presupuestos.splice(i,1);localStorage.setItem('vtuc',JSON.stringify(presupuestos));render();}}
render();
</script>
</body>
</html>
