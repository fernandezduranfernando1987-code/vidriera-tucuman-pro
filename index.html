<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrieria Tucuman Pro - FINAL v18 - 100 lineas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brandBlack: '#1A2A33',
        brandGreen: '#0FAC5C',
        brandBlue: '#5FA8D3',
        brandLight: '#E8F4F8',
        brandOrange: '#E36414'
      }
    }
  }
}
</script>
<style>
body{font-family:'Open Sans',sans-serif}
h1,h2,h3,.mont{font-family:'Montserrat',sans-serif}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#E8F4F8] min-h-screen flex flex-col">
<div id="app"></div>
<script>
const VIDRIOS = [
 {id:'float4',nombre:'Float 4mm',precio:8500},
 {id:'float6',nombre:'Float 6mm',precio:11500},
 {id:'laminado',nombre:'Laminado 3+3 Seguridad',precio:18500},
 {id:'templado',nombre:'Templado 6mm Seguridad',precio:19500},
 {id:'dvh',nombre:'DVH 4/9/4',precio:25000},
];
const LOCALIDADES = ['San Miguel de Tucuman','Tafi Viejo','Yerba Buena','Banda del Rio Sali','Las Talitas','Lules','Manantial','AldereTEs'];
const ESTADOS = ['Medicion pendiente','Presupuestado','Aprobado','En taller','Instalado','Cobrado'];
function calcM2(a,b){return (parseFloat(a)||0)*(parseFloat(b)||0)/10000;}
function aviso150(an,al){
 var anN = Number(an)||0; var alN = Number(al)||0;
 if(anN>150 || alN>150){
  return '<div class="bg-orange-50 border-l-4 border-[#E36414] text-[#1A2A33] p-3 mb-3 rounded mont font-bold text-sm">Atencion: medida mayor a 150cm requiere templado.</div>';
 }
 return '';
}
function cargarDatos(){
 var claves = ['vtuc','presupuestos','vidriera','clientes','vidriera_tucuman','vt'];
 var mejor = [];
 for(var i=0;i<claves.length;i++){
  var v = localStorage.getItem(claves[i]);
  if(v && v.length>10){
   try{var arr = JSON.parse(v); if(Array.isArray(arr) && arr.length>mejor.length){mejor = arr;}}catch(e){}
  }
 }
 return mejor;
}
var presupuestos = cargarDatos();
var form = {cliente:'',localidad:LOCALIDADES[0],vidrio:VIDRIOS[0].id,ancho:'',alto:'',estado:ESTADOS[0],busqueda:''};
function exportar(){
 var data = JSON.stringify(presupuestos);
 var blob = new Blob([data],{type:'application/json'});
 var a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'backup-vidriera.json';
 a.click();
}
function render(){
 var app = document.getElementById('app');
 var totalM2 = calcM2(form.ancho,form.alto);
 var vidSel = null;
 for(var i=0;i<VIDRIOS.length;i++){if(VIDRIOS[i].id===form.vidrio){vidSel=VIDRIOS[i];}}
 if(!vidSel) vidSel=VIDRIOS[0];
 var totalPrecio = Math.round(totalM2*vidSel.precio);
 var optsLoc = '';
 for(var i=0;i<LOCALIDADES.length;i++){
  var l = LOCALIDADES[i];
  var sel = form.localidad===l ? ' selected' : '';
  optsLoc += '<option'+sel+'>'+l+'</option>';
 }
 var optsVid = '';
 for(var i=0;i<VIDRIOS.length;i++){
  var v = VIDRIOS[i];
  var sel = form.vidrio===v.id ? ' selected' : '';
  optsVid += '<option value="'+v.id+'"'+sel+'>'+v.nombre+'</option>';
 }
 var optsEst = '';
 for(var i=0;i<ESTADOS.length;i++){
  var e = ESTADOS[i];
  var sel = form.estado===e ? ' selected' : '';
  optsEst += '<option'+sel+'>'+e+'</option>';
 }
 var filtrados = [];
 for(var i=0;i<presupuestos.length;i++){
  var p = presupuestos[i];
  if(!form.busqueda){filtrados.push(p);}
  else{
   var b = form.busqueda.toLowerCase();
   var c = (p.cliente||'').toLowerCase();
   var loc = (p.localidad||'').toLowerCase();
   if(c.indexOf(b)>=0 || loc.indexOf(b)>=0){filtrados.push(p);}
  }
 }
 var lista = '';
 if(filtrados.length===0){
  lista = '<div class="bg-white rounded-2xl p-8 text-center border border-dashed border-[#5FA8D3]/40"><p class="text-[#1A2A33]/60 mont">No hay presupuestos. Si tenias 100 antes, dale a Recuperar.</p><button onclick="recuperar()" class="mt-3 bg-[#E36414] text-white px-4 py-2 rounded-lg text-sm font-bold">Recuperar 100+ clientes</button></div>';
 } else {
  for(var i=0;i<filtrados.length;i++){
   var p = filtrados[i];
   var idx = presupuestos.indexOf(p);
   lista += '<div class="bg-white rounded-2xl shadow-sm border border-[#5FA8D3]/20 p-4 mb-3">';
   lista += '<div class="flex justify-between"><div>';
   lista += '<p class="mont font-bold text-[#1A2A33]">'+p.cliente+'</p>';
   lista += '<p class="text-xs text-[#1A2A33]/70">'+p.localidad+' - '+p.vidrioNombre+'</p>';
   lista += '<p class="text-xs text-[#1A2A33]/60">'+p.ancho+'x'+p.alto+'cm - '+p.m2+' m2</p>';
   lista += '</div><div class="text-right">';
   lista += '<p class="font-extrabold text-[#0FAC5C]">$'+p.total.toLocaleString('es-AR')+'</p>';
   lista += '<span class="bg-[#5FA8D3]/20 text-[#1A2A33] text-[10px] font-bold px-2 py-1 rounded-full mont">'+p.estado+'</span>';
   lista += '</div></div>';
   lista += '<div class="flex gap-2 mt-3"><button onclick="borrar('+idx+')" class="flex-1 bg-[#E8F4F8] text-[#1A2A33] text-xs font-bold py-2 rounded-lg">Borrar</button><a href="https://wa.me/5493814557202?text=Presupuesto" target="_blank" class="flex-1 bg-[#1A2A33] text-white text-xs font-bold py-2 rounded-lg text-center">WhatsApp</a></div>';
   lista += '</div>';
  }
 }
 var html = '';
 html += '<header class="bg-[#1A2A33] text-white shadow-lg">';
 html += '<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">';
 html += '<h1 class="mont font-extrabold text-xl">Vidrieria Tucuman <span class="text-[#5FA8D3]">PRO</span></h1>';
 html += '<div class="flex gap-2"><span class="bg-[#0FAC5C] text-[#1A2A33] text-xs font-bold px-3 py-1 rounded-full mont">v18 100 lineas</span><button onclick="exportar()" class="bg-[#5FA8D3] text-[#1A2A33] text-xs font-bold px-3 py-1 rounded-lg">Exportar</button></div>';
 html += '</div></header>';
 html += '<main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 grid lg:grid-cols-2 gap-6">';
 html += '<section class="bg-white rounded-2xl shadow-sm border border-[#5FA8D3]/20 p-5 h-fit">';
 html += '<h2 class="mont font-bold text-[#1A2A33] text-lg mb-4">Nuevo Presupuesto</h2>';
 html += aviso150(form.ancho,form.alto);
 html += '<div class="space-y-4"><div><label class="text-sm font-semibold text-[#1A2A33]">Cliente</label><input id="cliente" value="'+form.cliente+'" class="w-full mt-1 border border-[#5FA8D3]/30 rounded-lg px-3 py-2 bg-[#E8F4F8]/50" placeholder="Nombre"></div>';
 html += '<div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-semibold">Localidad</label><select id="localidad" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsLoc+'</select></div><div><label class="text-sm font-semibold">Vidrio</label><select id="vidrio" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsVid+'</select></div></div>';
 html += '<div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-semibold">Ancho (cm)</label><input id="ancho" type="number" value="'+form.ancho+'" class="w-full mt-1 border rounded-lg px-3 py-2"></div><div><label class="text-sm font-semibold">Alto (cm)</label><input id="alto" type="number" value="'+form.alto+'" class="w-full mt-1 border rounded-lg px-3 py-2"></div></div>';
 html += '<div class="bg-[#1A2A33] text-white rounded-xl p-4 flex justify-between items-center"><div><p class="text-xs text-[#5FA8D3] mont">TOTAL</p><p class="font-bold text-lg">'+totalM2.toFixed(2)+' m2</p></div><div class="text-right"><p class="text-xs text-[#5FA8D3] mont">'+vidSel.nombre+'</p><p class="font-extrabold text-xl text-[#0FAC5C]">$'+totalPrecio.toLocaleString('es-AR')+'</p></div></div>';
 html += '<div><label class="text-sm font-semibold">Estado</label><select id="estado" class="w-full mt-1 border rounded-lg px-3 py-2 bg-white">'+optsEst+'</select></div>';
 html += '<button id="btnGuardar" class="w-full bg-[#0FAC5C] hover:bg-[#0FAC5C]/90 text-[#1A2A33] mont font-bold py-3 rounded-xl shadow-md">Guardar Presupuesto</button></div></section>';
 html += '<section class="space-y-4"><div class="flex justify-between items-center"><h2 class="mont font-bold text-[#1A2A33] text-lg">Presupuestos ('+filtrados.length+'/'+presupuestos.length+')</h2><input id="busqueda" value="'+form.busqueda+'" placeholder="Buscar..." class="border rounded-lg px-3 py-2 text-sm w-40"></div>'+lista+'</section>';
 html += '</main>';
 html += '<footer class="bg-[#1A2A33] text-[#5FA8D3]/60 text-center text-xs py-3 mont">Vidrieria Tucuman PRO - #1A2A33 #0FAC5C #5FA8D3 #E8F4F8 #E36414</footer>';
 app.innerHTML = html;
 document.getElementById('cliente').addEventListener('input',function(e){form.cliente=e.target.value; render();});
 document.getElementById('localidad').addEventListener('change',function(e){form.localidad=e.target.value; render();});
 document.getElementById('vidrio').addEventListener('change',function(e){form.vidrio=e.target.value; render();});
 document.getElementById('ancho').addEventListener('input',function(e){form.ancho=e.target.value; render();});
 document.getElementById('alto').addEventListener('input',function(e){form.alto=e.target.value; render();});
 document.getElementById('estado').addEventListener('change',function(e){form.estado=e.target.value;});
 document.getElementById('busqueda').addEventListener('input',function(e){form.busqueda=e.target.value; render();});
 document.getElementById('btnGuardar').addEventListener('click',guardar);
}
function guardar(){
 if(!form.cliente||!form.ancho||!form.alto){alert('Completa cliente, ancho y alto');return;}
 var vidSel = null;
 for(var i=0;i<VIDRIOS.length;i++){if(VIDRIOS[i].id===form.vidrio){vidSel=VIDRIOS[i];}}
 var m2 = calcM2(form.ancho,form.alto);
 presupuestos.unshift({cliente:form.cliente,localidad:form.localidad,vidrio:form.vidrio,vidrioNombre:vidSel.nombre,ancho:form.ancho,alto:form.alto,m2:m2.toFixed(2),total:Math.round(m2*vidSel.precio),estado:form.estado});
 localStorage.setItem('vtuc',JSON.stringify(presupuestos));
 localStorage.setItem('presupuestos',JSON.stringify(presupuestos));
 form.cliente='';form.ancho='';form.alto='';
 render();
}
function borrar(i){
 if(confirm('Borrar?')){
  presupuestos.splice(i,1);
  localStorage.setItem('vtuc',JSON.stringify(presupuestos));
  localStorage.setItem('presupuestos',JSON.stringify(presupuestos));
  render();
 }
}
function recuperar(){
 var datos = cargarDatos();
 if(datos.length>0){
  presupuestos = datos;
  localStorage.setItem('vtuc',JSON.stringify(presupuestos));
  alert('Recuperados '+datos.length+' presupuestos');
  render();
 } else {
  alert('No se encontro backup en este navegador. Probá en la otra PC donde tenias los 100+');
 }
}
render();
</script>
</body>
</html>
