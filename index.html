<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidriería Tucumán Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const VIDRIOS = [
  {id:'float4', nombre:'Float 4mm', base:{precio: 8500}},
  {id:'float6', nombre:'Float 6mm', base:{precio: 11500}},
  {id:'laminado', nombre:'Laminado 3+3', base:{precio: 18500}},
  {id:'templado', nombre:'Templado 6mm', base:{precio: 19500}},
  {id:'dvh', nombre:'DVH', base:{precio: 25000}},
];
const LOCALIDADES = ['San Miguel de Tucumán','Tafí Viejo','Yerba Buena','Banda del Río Salí','Lules'];
const ESTADOS = ['Medición pendiente','Presupuestado','Aprobado','En taller','Colocada','Rechazada'];
const calcM2 = (a,b) => { const an = parseFloat(a)||0; const al = parseFloat(b)||0; if(!an||!al) return 0; return (an*al)/10000; };

const Aviso150 = ({ancho, alto}) => {
  const an = Number(ancho)||0; const al = Number(alto)||0;
  if(an>150 || al>150){
    return (<div className="bg-yellow-100 border border-yellow-400 text-yellow-900 px-2 py-1 rounded-md text-xs mt-2">⚠️ <b>Lado >150cm:</b> sugerimos templado o laminado por seguridad (paño {an}x{al} cm)</div>);
  } return null;
};
const initialOrders = [
  {id:1, c:'Kiosco Centro', loc:'San Miguel de Tucumán', mot:'frente 180x220', urg:true, est:'Medición pendiente', pan:[{a:180,b:220,c:1,t:'float4'}]},
  {id:2, c:'Mariela Díaz', loc:'Tafí Viejo', mot:'2 ventanas 80x110', urg:false, est:'Presupuestado', pan:[{a:80,b:110,c:2,t:'float6'}]},
];
function App(){
  const [ordenes, setOrdenes] = useState(initialOrders);
  const [vista, setVista] = useState(window.location.hash || '#');
  const [form, setForm] = useState({cliente:'', localidad:LOCALIDADES[0], motivo:'', estado:ESTADOS[0], urgencia:false});
  const [pForm, setPForm] = useState({ancho:'',alto:'',cantidad:1,tipoVidrio:'float4'});
  const [config] = useState({precios:{float4:{v:{precio:8500}},float6:{v:{precio:11500}},laminado:{v:{precio:18500}},templado:{v:{precio:19500}},dvh:{v:{precio:25000}}}});
  useEffect(()=>{ const onHash = () => setVista(window.location.hash); window.addEventListener('hashchange', onHash); return ()=>window.removeEventListener('hashchange', onHash); },[]);
  const agregarPano = () => {
    const an = parseFloat(pForm.ancho); const al = parseFloat(pForm.alto); const ca = parseInt(pForm.cantidad);
    if(!an || !al || !ca){ alert('Medidas fuera de rango: ingresa ancho, alto y cantidad válidos'); return; }
    if(an<10||an>300||al<10||al>300){ alert('Medidas fuera de rango: 10 a 300 cm'); return; }
    return {a:an,b:al,c:ca,t:pForm.tipoVidrio};
  };
  const handleCrearOrden = (e) => { e.preventDefault(); const pan = agregarPano(); if(!pan) return; const nueva = { id: Date.now(), c: form.cliente || 'Cliente sin nombre', loc: form.localidad, mot: form.motivo, est: form.estado, urg: form.urgencia, pan: [pan] }; setOrdenes([nueva, ...ordenes]); setPForm({ancho:'',alto:'',cantidad:1,tipoVidrio:'float4'}); };
  if(vista==='#admin'){
    return (<div className="min-h-screen"><div className="bg-slate-900 text-white p-3 flex justify-between"><div className="font-bold">VIDRIERÍA TUCUMÁN PRO</div><a href="#admin" className="text-sm bg-white text-slate-900 px-2 py-1 rounded">Admin</a></div><div className="p-6 mt-10 bg-white rounded shadow max-w-3xl mx-auto"><h1 className="text-xl font-bold mb-2">Panel Admin</h1><p className="text-xs bg-yellow-100 p-2 rounded mb-4">Acceso validado por colaborador: Kodarvia (Pending Invite válido)</p><a href="#" className="text-blue-600 underline">Volver</a></div></div>);
  }
  return (
    <div className="min-h-screen pb-10">
      <div className="bg-slate-900 text-white p-3 flex justify-between sticky top-0"><div className="font-bold">VIDRIERÍA TUCUMÁN PRO</div><a href="#admin" className="text-sm">Admin - /admin</a></div>
      <div className="max-w-5xl mx-auto p-4 grid md:grid-cols-2 gap-4">
        <div className="bg-white p-4 rounded shadow h-fit">
          <h2 className="font-bold mb-3">Nueva Orden</h2>
          <form onSubmit={handleCrearOrden} className="space-y-3">
            <input className="w-full border p-2 rounded" placeholder="Cliente" value={form.cliente} onChange={e=>setForm({...form, cliente:e.target.value})} />
            <select className="w-full border p-2 rounded" value={form.localidad} onChange={e=>setForm({...form, localidad:e.target.value})}>{LOCALIDADES.map(l=><option key={l}>{l}</option>)}</select>
            <input className="w-full border p-2 rounded" placeholder="Motivo / Medidas" value={form.motivo} onChange={e=>setForm({...form, motivo:e.target.value})} />
            <div className="grid grid-cols-3 gap-2">
              <input type="number" className="border p-2 rounded" placeholder="Ancho cm" value={pForm.ancho} onChange={e=>setPForm({...pForm, ancho:e.target.value})} />
              <input type="number" className="border p-2 rounded" placeholder="Alto cm" value={pForm.alto} onChange={e=>setPForm({...pForm, alto:e.target.value})} />
              <input type="number" className="border p-2 rounded" placeholder="Cant" value={pForm.cantidad} onChange={e=>setPForm({...pForm, cantidad:e.target.value})} />
            </div>
            <select className="w-full border p-2 rounded" value={pForm.tipoVidrio} onChange={e=>setPForm({...pForm, tipoVidrio:e.target.value})}>{VIDRIOS.map(v=><option key={v.id} value={v.id}>{v.nombre}</option>)}</select>
            <Aviso150 ancho={pForm.ancho} alto={pForm.alto} />
            <button className="w-full bg-slate-900 text-white p-2 rounded font-bold">Crear Orden</button>
          </form>
        </div>
        <div className="space-y-3">
          {ordenes.map(o=>(<div key={o.id} className="bg-white p-4 rounded shadow"><div className="flex justify-between"><div className="font-bold">{o.c} - {o.loc}</div>{o.urg && <span className="bg-red-100 text-red-800 text-xs px-2 py-1 rounded">URGENTE</span>}</div><div className="text-sm text-slate-600">{o.mot} | {o.est}</div><div className="mt-2 space-y-2">{o.pan.map((p,j)=>{const v=VIDRIOS.find(x=>x.id===p.t); const m2=calcM2(p.a,p.b); return (<div key={j} className="border p-2 rounded bg-slate-50"><div className="text-sm">{v?.nombre} - {p.a} x {p.b} cm x {p.c} - {m2.toFixed(2)} m2</div><Aviso150 ancho={p.a} alto={p.b} /></div>);})}</div></div>))}
        </div>
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App/>);
</script>
</body>
</html>
