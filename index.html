<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vidrieria Tucuman Pro</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-slate-50"><div id="root"></div><script type="text/babel">
const {useState,useEffect}=React;
const VIDRIOS=[{id:'float3',nombre:'float de 3 mm',precio:45000},{id:'float4',nombre:'float de 4 mm',precio:55000},{id:'laminado33',nombre:'laminado 3+3',precio:98000},{id:'templado6',nombre:'templado de 6 mm',precio:120000},{id:'templado10',nombre:'templado de 10 mm',precio:175000},{id:'espejo4',nombre:'espejo de 4 mm',precio:70000},{id:'espejoBis',nombre:'espejo de 4 mm biselado',precio:95000},{id:'fantasia4',nombre:'fantasía de 4 mm',precio:62000}];
const LOCALIDADES=['San Miguel de Tucumán','Yerba Buena','Banda del Río Salí','Tafí Viejo','Las Talitas','Alderetes'];
const ESTADOS=['Pedido recibido','Medición pendiente','Presupuestada','Aprobada','En corte','Lista para colocar','Colocada','Rechazada'];
const calcM2=(a,b)=>+(a*b/10000).toFixed(2);const fmt=n=>'$ '+(n||0).toLocaleString('es-AR');
function App(){
 const [ordenes,setOrdenes]=useState(()=>{try{const s=localStorage.getItem('vt_ordenes');return s?JSON.parse(s):[]}catch(e){return []}});
 const [config,setConfig]=useState(()=>{try{const s=localStorage.getItem('vt_config');return s?JSON.parse(s):{minimo:0.25,colocacionCosto:30000,claveAdmin:'tucuman2024',precios:{float3:45000,float4:55000,laminado33:98000,templado6:120000,templado10:175000,espejo4:70000,espejoBis:95000,fantasia4:62000}}}catch(e){return{minimo:0.25,colocacionCosto:30000,claveAdmin:'tucuman2024'}}});
 const [vista,setVista]=useState('lista');const [selId,setSelId]=useState(null);const [filtroUrg,setFiltroUrg]=useState(false);
 const [adminOk,setAdminOk]=useState(false);const [claveInput,setClaveInput]=useState('');
 const isAdmin=window.location.hash.includes('admin');
 useEffect(()=>{localStorage.setItem('vt_ordenes',JSON.stringify(ordenes));},[ordenes]);
 useEffect(()=>{localStorage.setItem('vt_config',JSON.stringify(config));},[config]);
 const cargarDemo=()=>{
   if(ordenes.length>0){if(!confirm('¿Borrar lo actual y cargar 13 pedidos demo?')) return;}
   setFiltroUrg(false);
   const base=[{c:'Kiosco El Sol',loc:'Yerba Buena',mot:'frente 180x220',urg:true,est:'Medición pendiente',pan:[{a:180,b:220,c:1,t:'float4'}]},{c:'Mariela Díaz',loc:'Tafí Viejo',mot:'2 ventanas 80x110',urg:true,est:'Pedido recibido',pan:[{a:80,b:110,c:2,t:'float4'}]},{c:'Roberto Sal',loc:'San Miguel de Tucumán',mot:'puerta balcón 90x210',urg:true,est:'Presupuestada',pan:[{a:90,b:210,c:1,t:'templado10'}]},{c:'Paola Vega',loc:'Yerba Buena',mot:'espejo biselado 120x80',urg:false,est:'Aprobada',pan:[{a:120,b:80,c:1,t:'espejoBis'}]},{c:'Farmacia Central',loc:'San Miguel de Tucumán',mot:'vidriera 150x200',urg:true,est:'En corte',pan:[{a:150,b:200,c:1,t:'laminado33'}]},{c:'Marta Ríos',loc:'San Miguel de Tucumán',mot:'ventana float',urg:false,est:'Colocada',pan:[{a:100,b:100,c:1,t:'float4'}]},{c:'Ana Costilla',loc:'Alderetes',mot:'ventana 60x60',urg:false,est:'Pedido recibido',pan:[]},{c:'Sergio Mena',loc:'Las Talitas',mot:'4 ventanas fantasía',urg:false,est:'Aprobada',pan:[{a:60,b:60,c:4,t:'fantasia4'}]},{c:'Lucía Nieva',loc:'Banda del Río Salí',mot:'tapa mesa 100x60',urg:false,est:'En corte',pan:[{a:100,b:60,c:1,t:'float4'}]},{c:'Hugo Tula',loc:'Tafí Viejo',mot:'3 estantes 30x20',urg:false,est:'Lista para colocar',pan:[{a:30,b:20,c:3,t:'float4'}]},{c:'Daniel Gómez',loc:'Alderetes',mot:'espejo 60x150',urg:false,est:'Colocada',pan:[{a:60,b:150,c:1,t:'espejo4'}]},{c:'Carla Paz',loc:'Yerba Buena',mot:'mampara 90x190',urg:false,est:'Rechazada',pan:[{a:90,b:190,c:1,t:'templado6'}]},{c:'Estudio Norte',loc:'San Miguel de Tucumán',mot:'división 200x240',urg:false,est:'Presupuestada',pan:[{a:200,b:240,c:1,t:'templado10'}]}];
   const nuevas=base.map((d,i)=>{const panos=d.pan.map((p,j)=>{const v=VIDRIOS.find(x=>x.id===p.t);const precioCfg=config.precios?config.precios[p.t]:v.precio;const m2=calcM2(p.a,p.b);const mf=Math.max(m2,config.minimo);return{id:Date.now()+i*10+j,ancho:p.a,alto:p.b,cantidad:p.c,tipoVidrio:p.t,m2,m2Fact:mf,subtotal:Math.round(mf*(precioCfg||v.precio)*p.c)};});return{id:Date.now()+i+Math.random(),numero:1000+i,cliente:d.c,celular:'381 4'+(1000000+i),localidad:d.loc,direccion:'Calle '+i,motivo:d.mot,urgente:d.urg,fechaMedicion:new Date().toISOString().slice(0,10),panos,colocacion:false,descuento:0,notas:'',estado:d.est,motivoRechazo:d.est==='Rechazada'?'eligió otro presupuesto':'',colocacionProvisoria:false};});setOrdenes(nuevas);setVista('lista');
 };
 const sel=ordenes.find(o=>o.id===selId);
 if(isAdmin){
   if(!adminOk){return(<div className="max-w-sm mx-auto p-6 mt-10 bg-white rounded shadow"><h1 className="text-xl font-bold mb-2">Panel Admin</h1><p className="text-xs bg-yellow-100 p-2 rounded mb-3">Clave por defecto: <b>tucuman2024</b></p><input type="password" placeholder="Clave" value={claveInput} onChange={e=>setClaveInput(e.target.value)} className="border p-2 rounded w-full mb-2"/><button onClick={()=>{if(claveInput===config.claveAdmin){setAdminOk(true);}else{alert('Clave incorrecta, probá tucuman2024');}}} className="w-full bg-slate-900 text-white py-2 rounded">Entrar</button><a href="#" onClick={()=>{window.location.hash='';location.reload();}} className="block text-center text-blue-600 mt-3 text-sm">Volver</a></div>);}
   return(<div className="max-w-3xl mx-auto p-4"><h1 className="text-2xl font-bold">Admin - /admin</h1><div className="bg-white p-4 rounded shadow mt-4 space-y-4"><div className="grid grid-cols-2 gap-2">{VIDRIOS.map(v=><div key={v.id} className="text-sm"><label className="block text-xs">{v.nombre}</label><input type="number" value={config.precios?config.precios[v.id]:v.precio} onChange={e=>{const np={...config.precios,[v.id]:parseInt(e.target.value)||0};setConfig({...config,precios:np});}} className="border p-1 rounded w-full"/></div>)}</div><div>Mínimo m2: <input type="number" step="0.01" value={config.minimo} onChange={e=>setConfig({...config,minimo:parseFloat(e.target.value)||0.25})} className="border p-1 rounded"/></div><div>Costo colocación: <input type="number" value={config.colocacionCosto} onChange={e=>setConfig({...config,colocacionCosto:parseInt(e.target.value)||0})} className="border p-1 rounded"/></div><div>Clave: <input type="text" value={config.claveAdmin} onChange={e=>setConfig({...config,claveAdmin:e.target.value})} className="border p-1 rounded"/> (actual: {config.claveAdmin})</div><button onClick={()=>{localStorage.clear(); alert('Borrado'); location.reload();}} className="bg-red-500 text-white px-3 py-1 rounded">Borrar localStorage</button><a href="#" onClick={()=>{window.location.hash='';location.reload();}} className="block text-blue-600 mt-4">Volver</a></div></div>);
 }
 if(vista==='detalle'&&sel){return<Detalle orden={sel} config={config} setOrdenes={setOrdenes} ordenes={ordenes} setVista={setVista} VIDRIOS={VIDRIOS} LOCALIDADES={LOCALIDADES} ESTADOS={ESTADOS}/>;}
 const lista=filtroUrg?ordenes.filter(o=>o.urgente&&o.estado!=='Colocada'&&o.estado!=='Rechazada'):ordenes;
 const grupos={};lista.filter(o=>o.urgente).forEach(o=>{(grupos[o.localidad]=grupos[o.localidad]||[]).push(o);});
 return(<div className="min-h-screen"><header className="bg-slate-900 text-white p-3 flex justify-between"><div className="font-bold">VIDRIERÍA TUCUMÁN PRO</div><a href="#admin" className="text-sm bg-white/20 px-2 py-1 rounded">/admin</a></header><div className="max-w-6xl mx-auto p-3"><div className="flex gap-2 mb-3 flex-wrap"><button onClick={()=>{const n={id:Date.now()+Math.random(),numero:1000+ordenes.length,cliente:'Nuevo Cliente',celular:'381 4000000',localidad:LOCALIDADES[0],direccion:'',motivo:'',urgente:false,fechaMedicion:new Date().toISOString().slice(0,10),panos:[],colocacion:false,descuento:0,notas:'',estado:'Pedido recibido',motivoRechazo:'',colocacionProvisoria:false};setOrdenes([...ordenes,n]);setSelId(n.id);setVista('detalle');setFiltroUrg(false);}} className="bg-blue-600 text-white px-4 py-2 rounded">+ Nuevo Pedido</button><button onClick={cargarDemo} className="bg-slate-200 px-3 py-2 rounded text-sm">Cargar 13 pedidos demo</button><button onClick={()=>setFiltroUrg(!filtroUrg)} className={(filtroUrg?'bg-orange-500 text-white':'bg-white border')+' px-3 py-2 rounded text-sm'}>{filtroUrg?'Ver todos':'Cola urgencias'}</button>{ordenes.length>0&&<button onClick={()=>{if(confirm('¿Borrar todo?')){setOrdenes([]);localStorage.removeItem('vt_ordenes');}}} className="bg-red-100 px-3 py-2 rounded text-sm">Borrar todo</button>}</div>{filtroUrg?(<div className="space-y-4"><h2 className="font-bold text-orange-600">Cola urgencias - por localidad</h2>{Object.entries(grupos).sort().map(([loc,arr])=>(<div key={loc} className="bg-white rounded shadow p-3"><h3 className="font-bold">{loc} ({arr.length})</h3>{arr.sort((a,b)=>(a.colocacionProvisoria?1:0)-(b.colocacionProvisoria?1:0)).map(o=>(<div key={o.id} className={"flex justify-between border-b py-2 cursor-pointer text-sm "+(o.colocacionProvisoria?'opacity-40':'')} onClick={()=>{setSelId(o.id);setVista('detalle');}}><span>#{o.numero} {o.cliente}</span><span className="text-orange-600 font-bold">URGENTE</span></div>))}</div>))}</div>):(<div className="bg-white rounded shadow divide-y"><div className="p-2 text-xs text-slate-500">Total: {ordenes.length} - Si no ves 13, dale Borrar todo y luego Cargar 13</div>{ordenes.map(o=>{const getPrecio=(id)=>{const base=VIDRIOS.find(v=>v.id===id);const cfg=config.precios?config.precios[id]:null;return cfg||base.precio;};const tot=(o.panos||[]).reduce((s,p)=>{const pr=getPrecio(p.tipoVidrio);const m2=calcM2(p.ancho,p.alto);const mf=Math.max(m2,config.minimo);return s+Math.round(mf*pr*p.cantidad);},0)+(o.colocacion?config.colocacionCosto:0)-(o.descuento||0);return(<div key={o.id} className={"p-3 flex justify-between hover:bg-slate-50 cursor-pointer "+(o.estado==='Colocada'?'bg-slate-100':'')+(o.urgente?' border-l-4 border-orange-500':'')} onClick={()=>{setSelId(o.id);setVista('detalle');}}><div><div className="font-bold text-sm">#{o.numero} {o.cliente} - {o.localidad}</div><div className="text-xs text-slate-500">{o.motivo} | {o.estado} {o.urgente?'| URGENTE':''}</div></div><div className="text-sm font-bold">{fmt(Math.max(0,tot))}</div></div>);})}</div>)}</div></div>);
}
function Detalle({orden,config,setOrdenes,ordenes,setVista,VIDRIOS,LOCALIDADES,ESTADOS}){
 const [form,setForm]=useState(orden);const [pForm,setPForm]=useState({ancho:'',alto:'',cantidad:1,tipoVidrio:'float4'});const [wa,setWa]=useState('');const isRO=form.estado==='Colocada';
 useEffect(()=>{const tot=(form.panos||[]).reduce((s,p)=>{const base=VIDRIOS.find(v=>v.id===p.tipoVidrio);const cfg=config.precios?config.precios[p.tipoVidrio]:null;const pr=cfg||base.precio;return s+Math.round(p.m2Fact*pr*p.cantidad);},0)+(form.colocacion?config.colocacionCosto:0)-(form.descuento||0);const tf=Math.max(0,tot);if(form.panos&&form.panos.length>0){const p0=form.panos[0];const v=VIDRIOS.find(x=>x.id===p0.tipoVidrio);setWa(`Hola ${form.cliente}, tu presupuesto: ${form.panos.length} ${v?v.nombre:'paño'} de ${p0.ancho} por ${p0.alto} cm. Total: ${fmt(tf)}`);}else{setWa(`Hola ${form.cliente}, tu presupuesto: ${form.motivo}. Total: ${fmt(tf)}`);}},[form.panos,form.colocacion,form.descuento,form.cliente,form.motivo,config.precios]);
 const upd=p=>{if(isRO)return;setForm({...form,...p});};
 const addPano=()=>{const an=parseFloat(pForm.ancho);const al=parseFloat(pForm.alto);const ca=parseInt(pForm.cantidad);if(!an||!al){alert('Medidas fuera de rango: ingresa ancho y alto');return;}if(an<10||an>300||al<10||al>300){alert('Medidas fuera de rango (10-300 cm) y no se guardan');return;}const m2=calcM2(an,al);const mf=Math.max(m2,config.minimo);const base=VIDRIOS.find(v=>v.id===pForm.tipoVidrio);const cfg=config.precios?config.precios[pForm.tipoVidrio]:null;const pr=cfg||base.precio;const sub=Math.round(mf*pr*ca);const esTL=pForm.tipoVidrio.includes('templado')||pForm.tipoVidrio.includes('laminado');if((an>150||al>150)&&!esTL){alert('Conviene templado o laminado para este tamaño');}setForm({...form,panos:[...(form.panos||[]),{id:Date.now()+Math.random(),ancho:an,alto:al,cantidad:ca,tipoVidrio:pForm.tipoVidrio,m2,m2Fact:mf,subtotal:sub}]});setPForm({ancho:'',alto:'',cantidad:1,tipoVidrio:pForm.tipoVidrio});};
 const guardar=()=>{const idx=ordenes.findIndex(o=>o.id===form.id);const n=[...ordenes];n[idx]=form;setOrdenes(n);setVista('lista');};
 const cambiarEst=ne=>{if(ne==='Aprobada'&&(!form.panos||form.panos.length===0)){alert('No se puede pasar de Presupuestada a Aprobada sin al menos un paño cargado');return;}if(ne==='Rechazada'){const mot=prompt('Motivo de rechazo obligatorio:');if(!mot)return;upd({estado:ne,motivoRechazo:mot});}else{upd({estado:ne});}};
 const getPrecio=(id)=>{const base=VIDRIOS.find(v=>v.id===id);const cfg=config.precios?config.precios[id]:null;return cfg||base.precio;};
 const total=(form.panos||[]).reduce((s,p)=>{const pr=getPrecio(p.tipoVidrio);return s+Math.round(p.m2Fact*pr*p.cantidad);},0)+(form.colocacion?config.colocacionCosto:0)-(form.descuento||0);const totalF=Math.max(0,total);
 const descargarICS=()=>{const dt=(form.fechaMedicion||'').replace(/-/g,'');const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Medicion ${form.cliente}\nDTSTART:${dt}T100000\nEND:VEVENT\nEND:VCALENDAR`;const b=new Blob([ics],{type:'text/calendar'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='medicion-'+form.cliente+'.ics';a.click();};
 return(<div className="max-w-5xl mx-auto p-3"><button onClick={()=>setVista('lista')} className="mb-2 bg-slate-200 px-2 py-1 rounded text-sm">← Volver</button><div className="bg-white rounded shadow p-4 grid md:grid-cols-2 gap-4"><div className="space-y-2"><h2 className="font-bold">Ficha #{form.numero} {isRO?'(solo lectura)':''}</h2><input placeholder="Cliente" value={form.cliente} onChange={e=>upd({cliente:e.target.value})} disabled={isRO} className="border p-1 rounded w-full"/><input placeholder="Celular" value={form.celular} onChange={e=>upd({celular:e.target.value})} disabled={isRO} className="border p-1 rounded w-full"/><select value={form.localidad} onChange={e=>upd({localidad:e.target.value})} disabled={isRO} className="border p-1 rounded w-full">{LOCALIDADES.map(l=><option key={l} value={l}>{l}</option>)}</select><input placeholder="Dirección" value={form.direccion} onChange={e=>upd({direccion:e.target.value})} disabled={isRO} className="border p-1 rounded w-full"/><input placeholder="Motivo" value={form.motivo} onChange={e=>upd({motivo:e.target.value})} disabled={isRO} className="border p-1 rounded w-full"/><label className="flex gap-2 text-sm"><input type="checkbox" checked={form.urgente} onChange={e=>upd({urgente:e.target.checked})} disabled={isRO}/> Urgente</label><label className="flex gap-2 text-sm"><input type="checkbox" checked={form.colocacionProvisoria} onChange={e=>upd({colocacionProvisoria:e.target.checked})} disabled={isRO}/> Provisoria hecha</label><div className="flex gap-2"><input type="date" value={form.fechaMedicion} onChange={e=>upd({fechaMedicion:e.target.value})} disabled={isRO} className="border p-1 rounded"/><button onClick={()=>upd({estado:'Presupuestada'})} className="bg-blue-100 text-xs px-2 rounded">Ya tengo medidas</button></div><label className="flex gap-2 text-sm"><input type="checkbox" checked={form.colocacion} onChange={e=>upd({colocacion:e.target.checked})} disabled={isRO}/> Colocación (+${config.colocacionCosto})</label><input type="number" placeholder="Descuento" value={form.descuento} onChange={e=>upd({descuento:parseInt(e.target.value)||0})} disabled={isRO} className="border p-1 rounded w-full"/><textarea placeholder="Notas" value={form.notas} onChange={e=>upd({notas:e.target.value})} disabled={isRO} className="border p-1 rounded w-full"></textarea><div className="flex flex-wrap gap-1">{ESTADOS.map(es=><button key={es} onClick={()=>cambiarEst(es)} disabled={isRO} className={(form.estado===es?'bg-blue-600 text-white':'bg-slate-100')+' px-2 py-1 rounded text-xs'}>{es}</button>)}</div>{form.estado==='Rechazada'&&<div className="text-sm text-red-600">Motivo: {form.motivoRechazo}</div>}</div><div><h3 className="font-bold">Paños</h3><div className="text-xs text-slate-500">Ancho x Alto / 10000 = m2. Mín {config.minimo} m2.</div><div className="border rounded p-2 mt-2"><div className="grid grid-cols-2 gap-1"><input placeholder="Ancho cm" type="number" value={pForm.ancho} onChange={e=>setPForm({...pForm,ancho:e.target.value})} className="border p-1 rounded"/><input placeholder="Alto cm" type="number" value={pForm.alto} onChange={e=>setPForm({...pForm,alto:e.target.value})} className="border p-1 rounded"/><input placeholder="Cant" type="number" value={pForm.cantidad} onChange={e=>setPForm({...pForm,cantidad:e.target.value})} className="border p-1 rounded"/><select value={pForm.tipoVidrio} onChange={e=>setPForm({...pForm,tipoVidrio:e.target.value})} className="border p-1 rounded text-xs">{VIDRIOS.map(v=><option key={v.id} value={v.id}>{v.nombre} ${getPrecio(v.id)}</option>)}</select></div><button onClick={addPano} className="w-full bg-blue-600 text-white py-1 rounded text-sm mt-1">+ Agregar paño</button></div><div className="mt-3 divide-y">{(form.panos||[]).map((p,i)=><div key={p.id} className="py-1 text-sm flex justify-between"><span>{i+1}. {p.ancho}x{p.alto} x{p.cantidad} {p.tipoVidrio} {p.m2}m2 fact {p.m2Fact} {fmt(p.subtotal)}</span><button onClick={()=>{if(isRO)return;setForm({...form,panos:form.panos.filter(x=>x.id!==p.id)});}} className="text-red-500">x</button></div>)}</div><div className="mt-3 font-bold border-t pt-2">TOTAL: {fmt(totalF)}</div><div className="mt-4 space-y-2"><h4 className="font-bold text-sm">WhatsApp editable</h4><textarea value={wa} onChange={e=>setWa(e.target.value)} className="border p-1 rounded w-full text-sm h-20"></textarea><a href={"https://wa.me/"+(form.celular||'').replace(/\D/g,'')+"?text="+encodeURIComponent(wa)} target="_blank" className="block bg-green-500 text-white text-center py-1 rounded text-sm">WhatsApp</a><button onClick={descargarICS} className="w-full bg-slate-800 text-white py-1 rounded text-sm">Descargar .ics</button><button onClick={guardar} disabled={isRO} className="w-full bg-slate-900 text-white py-2 rounded mt-2">Guardar</button></div></div></div></div>);
}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script></body></html>
