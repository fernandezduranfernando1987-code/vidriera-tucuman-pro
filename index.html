<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrieria Tucuman PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={
 theme:{
  extend:{
   colors:{
    primary:'#0F4C5C',
    dark:'#1A2A33',
    accent:'#5FA8D3',
    bgsoft:'#E8F4F8',
    urgent:'#E36414'
   },
   fontFamily:{
    mont:['Montserrat'],
    sans:['Open Sans']
   }
  }
 }
}
</script>
</head>
<body class="bg-bgsoft font-sans text-dark">
<!-- HEADER -->
<header class="bg-dark text-white p-4 sticky top-0 z-10">
 <h1 class="font-mont text-xl">Vidrieria Tucuman <span class="text-accent">PRO</span></h1>
 <p class="text-xs opacity-70">Reposición de vidrios por paño, con metros cuadrados y urgencias</p>
</header>

<main class="max-w-3xl mx-auto p-4 grid gap-4">
<!-- FORMULARIO PAÑO -->
<section class="bg-white rounded-2xl p-5 shadow-sm border">
 <h2 class="font-mont text-primary mb-4">1. Nuevo paño</h2>
 <div class="grid grid-cols-2 gap-3">
  <input id="cliente" placeholder="Cliente / Obra" class="col-span-2 border rounded-lg p-2.5 text-sm">
  <input id="ancho" type="number" placeholder="Ancho (cm)" class="border rounded-lg p-2.5 text-sm">
  <input id="alto" type="number" placeholder="Alto (cm)" class="border rounded-lg p-2.5 text-sm">
  <select id="vidrio" class="col-span-2 border rounded-lg p-2.5 text-sm">
   <option value="8500">Float 4mm - $8.500 /m²</option>
   <option value="11500">Float 6mm - $11.500 /m²</option>
   <option value="18500">Laminado 3+3 - $18.500 /m²</option>
   <option value="19500">Templado 6mm - $19.500 /m²</option>
   <option value="25000">DVH - $25.000 /m²</option>
  </select>
  <select id="urgencia" class="col-span-2 border rounded-lg p-2.5 text-sm font-semibold">
   <option value="1">Normal - 24/48hs (sin recargo)</option>
   <option value="1.3">Urgente Hoy +30%</option>
   <option value="1.6">Muy Urgente 4hs +60%</option>
  </select>
 </div>

 <!-- CALCULO EN VIVO -->
 <div class="mt-4 bg-dark text-white rounded-xl p-4 flex justify-between items-center">
  <div>
   <p class="text-[10px] text-accent uppercase tracking-widest">Metros²</p>
   <p id="outM2" class="font-mont text-xl">0.00 m²</p>
   <p id="outMedida" class="text-xs opacity-60">0 x 0 cm</p>
  </div>
  <div class="text-right">
   <p id="outVidrio" class="text-[10px] text-accent">Float 4mm</p>
   <p id="outTotal" class="font-mont text-xl">$0</p>
   <p id="outUrg" class="text-[10px] bg-urgent px-2 py-0.5 rounded-full mt-1 hidden"></p>
  </div>
 </div>

 <button id="btnAdd" class="w-full mt-4 bg-primary text-white font-mont py-3 rounded-xl hover:opacity-90">Agregar paño</button>
</section>

<!-- LISTADO -->
<section>
 <h2 class="font-mont text-dark mb-2">2. Paños cargados (<span id="count">0</span>)</h2>
 <div id="lista" class="grid gap-2"></div>
 
 <div id="resumen" class="hidden mt-4 bg-primary text-white p-4 rounded-2xl">
  <div class="flex justify-between text-sm"><span>Total m²</span><b id="rM2">0</b></div>
  <div class="flex justify-between text-sm"><span>Cantidad paños</span><b id="rCant">0</b></div>
  <div class="flex justify-between font-mont text-lg mt-2 pt-2 border-t border-white/20"><span>TOTAL PRESUPUESTO</span><span id="rTotal">$0</span></div>
 </div>
</section>
</main>

<script>
let panos=[];
const $ = id => document.getElementById(id);
const vidriosText = ["Float 4mm","Float 6mm","Laminado 3+3","Templado 6mm","DVH"];

function calcular(){
 let an = parseFloat($('ancho').value)||0;
 let al = parseFloat($('alto').value)||0;
 let idx = $('vidrio').selectedIndex;
 let precioM2 = parseFloat($('vidrio').value);
 let urgFactor = parseFloat($('urgencia').value);
 let m2 = (an*al/10000);
 let total = Math.round(m2 * precioM2 * urgFactor);
 $('outM2').innerText = m2.toFixed(2) + ' m²';
 $('outMedida').innerText = an + ' x ' + al + ' cm';
 $('outTotal').innerText = '$' + total.toLocaleString('es-AR');
 $('outVidrio').innerText = vidriosText[idx];
 let tag = $('outUrg');
 if(urgFactor>1){ tag.classList.remove('hidden'); tag.innerText = $('urgencia').options[$('urgencia').selectedIndex].text; } else tag.classList.add('hidden');
 return {an,al,m2,total,idx,urgFactor};
}
['ancho','alto'].forEach(id=>$(id).addEventListener('input', calcular));
['vidrio','urgencia'].forEach(id=>$(id).addEventListener('change', calcular));

$('btnAdd').addEventListener('click', ()=>{
 let c = calcular();
 if(!c.an || !c.al){ alert('Cargá ancho y alto'); return; }
 let cliente = $('cliente').value || 'Cliente';
 panos.push({
  cliente: cliente,
  an: c.an, al: c.al,
  m2: c.m2,
  vidrio: vidriosText[c.idx],
  urgenciaTxt: $('urgencia').options[$('urgencia').selectedIndex].text,
  total: c.total
 });
 render();
 $('ancho').value=''; $('alto').value=''; calcular();
});

function render(){
 let html=''; let totM2=0; let tot=0;
 panos.forEach((p,i)=>{
  totM2+=p.m2; tot+=p.total;
  html+=`<div class="bg-white p-3 rounded-xl border flex justify-between items-center text-sm">
   <div><b class="font-mont text-dark">${p.cliente}</b><br>${p.vidrio} - ${p.an}x${p.al}cm - ${p.m2.toFixed(2)}m²<br><span class="text-urgent text-xs">${p.urgenciaTxt}</span></div>
   <div class="text-right"><b class="text-primary">$${p.total.toLocaleString('es-AR')}</b><br><button onclick="panos.splice(${i},1);render()" class="text-xs mt-1 bg-bgsoft px-2 py-1 rounded">Eliminar</button></div>
  </div>`;
 });
 $('lista').innerHTML = html || '<p class="text-sm opacity-50">Aún no hay paños. Cargá el primero arriba.</p>';
 $('count').innerText = panos.length;
 if(panos.length){
  $('resumen').classList.remove('hidden');
  $('rM2').innerText = totM2.toFixed(2)+' m²';
  $('rCant').innerText = panos.length;
  $('rTotal').innerText = '$'+tot.toLocaleString('es-AR');
 } else $('resumen').classList.add('hidden');
}
calcular();
</script>
</body>
</html>
