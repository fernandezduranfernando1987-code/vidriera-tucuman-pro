<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrieria Tucuman PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{p:'#0F4C5C',s:'#5FA8D3',bg:'#E8F4F8',accent:'#E36414',ink:'#1A2A33'},fontFamily:{mont:['Montserrat'],sans:['Open Sans']}}}}</script>
<style>body{font-family:'Open Sans'} .font-mont{font-family:'Montserrat'}</style>
</head>
<body class="bg-bg text-ink min-h-screen">
<div id="app"></div>
<script>
let CFG=JSON.parse(localStorage.getItem('vt_cfg')||'{"min":0.25,"coloc":30000,"clave":"tucuman2026"}');
let VIDRIOS=[{id:'f3',nombre:'float de 3 mm',precio:45000},{id:'f4',nombre:'float de 4 mm',precio:55000},{id:'lam33',nombre:'laminado 3+3',precio:98000},{id:'t6',nombre:'templado de 6 mm',precio:120000},{id:'t10',nombre:'templado de 10 mm',precio:175000},{id:'esp4',nombre:'espejo de 4 mm',precio:70000},{id:'espBis',nombre:'espejo de 4 mm biselado',precio:95000},{id:'fant4',nombre:'fantasía de 4 mm',precio:62000}];
let LOCALIDADES=["San Miguel de Tucumán","Yerba Buena","Banda del Río Salí","Tafí Viejo","Las Talitas","Alderetes"];
let ESTADOS=["Pedido recibido","Medición pendiente","Presupuestada","Aprobada","En corte","Lista para colocar","Colocada","Rechazada"];
let ORDENES=JSON.parse(localStorage.getItem('vt_ordenes')||'null');
function seed(){if(ORDENES)return ORDENES;let now=Date.now();return[{id:1001,cliente:'Kiosco El Sol',cel:'381 555-0101',loc:'Yerba Buena',dir:'Av Aconquija 1200',motivo:'Frente roto por tormenta',urg:true,prov:false,fMed:new Date(Date.now()+86400000).toISOString().slice(0,10),coloc:true,desc:0,notas:'',estado:'Medición pendiente',panos:[{ancho:180,alto:220,tipo:'f4',cant:1}],created:now-80000000},{id:1002,cliente:'Mariela Diaz',cel:'381 555-0102',loc:'Tafí Viejo',dir:'',motivo:'2 ventanas',urg:true,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Pedido recibido',panos:[{ancho:80,alto:110,tipo:'f4',cant:2}],created:now-70000000},{id:1003,cliente:'Roberto Sal',cel:'381 555-0103',loc:'San Miguel de Tucumán',dir:'Junín 450',motivo:'Puerta balcón',urg:true,prov:true,fMed:'',coloc:true,desc:5000,notas:'Cliente con provisoria',estado:'Presupuestada',panos:[{ancho:90,alto:210,tipo:'f4',cant:1}],created:now-60000000},{id:1004,cliente:'Ana Costilla',cel:'',loc:'Alderetes',dir:'',motivo:'Ventana 60x60',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Pedido recibido',panos:[{ancho:60,alto:60,tipo:'f3',cant:1}],created:now-50000000},{id:1005,cliente:'Estudio Norte',cel:'',loc:'San Miguel de Tucumán',dir:'',motivo:'División oficina',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Presupuestada',panos:[{ancho:200,alto:240,tipo:'t10',cant:1}],created:now-40000000},{id:1006,cliente:'Paola Vega',cel:'381 555-0106',loc:'Yerba Buena',dir:'',motivo:'Espejo biselado',urg:false,prov:false,fMed:'',coloc:true,desc:0,notas:'',estado:'Aprobada',panos:[{ancho:120,alto:80,tipo:'espBis',cant:1}],created:now-30000000},{id:1007,cliente:'Sergio Mena',cel:'',loc:'Las Talitas',dir:'',motivo:'4 ventanas fantasía',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Aprobada',panos:[{ancho:100,alto:100,tipo:'fant4',cant:4}],created:now-20000000},{id:1008,cliente:'Lucia Nieva',cel:'',loc:'Banda del Río Salí',dir:'',motivo:'Tapa de mesa',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'En corte',panos:[{ancho:100,alto:60,tipo:'t6',cant:1}],created:now-10000000},{id:1009,cliente:'Farmacia Central',cel:'',loc:'San Miguel de Tucumán',dir:'',motivo:'Vidriera laminado urgente',urg:true,prov:false,fMed:'',coloc:true,desc:0,notas:'',estado:'En corte',panos:[{ancho:150,alto:200,tipo:'lam33',cant:1}],created:now-9000000},{id:1010,cliente:'Hugo Tula',cel:'',loc:'Tafí Viejo',dir:'',motivo:'3 estantes chicos',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Lista para colocar',panos:[{ancho:30,alto:20,tipo:'f4',cant:3}],created:now-8000000},{id:1011,cliente:'Marta Rios',cel:'',loc:'San Miguel de Tucumán',dir:'',motivo:'Ventana float',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Colocada',panos:[{ancho:80,alto:110,tipo:'f4',cant:1}],created:now-7000000},{id:1012,cliente:'Daniel Gomez',cel:'',loc:'Alderetes',dir:'',motivo:'Espejo 60x150',urg:false,prov:false,fMed:'',coloc:true,desc:0,notas:'',estado:'Colocada',panos:[{ancho:60,alto:150,tipo:'esp4',cant:1}],created:now-6000000},{id:1013,cliente:'Carla Paz',cel:'',loc:'Yerba Buena',dir:'',motivo:'Mampara 90x190',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'Rechazada porque eligió otro presupuesto',estado:'Rechazada',panos:[{ancho:90,alto:190,tipo:'t6',cant:1}],created:now-5000000}];}
ORDENES=seed();function save(){localStorage.setItem('vt_ordenes',JSON.stringify(ORDENES));localStorage.setItem('vt_cfg',JSON.stringify(CFG));}
function getVidrio(id){return VIDRIOS.find(v=>v.id===id)||VIDRIOS[0];}
function calcPano(p){let m2=(p.ancho*p.alto)/10000;let m2Fact=m2<CFG.min?CFG.min:m2;let precio=getVidrio(p.tipo).precio;let sub=Math.round(m2Fact*precio*(p.cant||1));let aviso=(p.ancho>150||p.alto>150)&&!['t6','t10','lam33'].includes(p.tipo);return{m2:+m2.toFixed(2),m2Fact,sub,aviso};}
function calcOrden(o){let sum=o.panos.reduce((acc,p)=>acc+calcPano(p).sub,0);if(o.coloc)sum+=CFG.coloc;sum-=(o.desc||0);return sum<0?0:sum;}
let filtroEstado='Todos';let vista='ordenes';let editId=null;let tempPanos=[];let tempForm={tipo:'f4',ancho:'',alto:'',cant:1};let showRechazo=false;let isHashAdmin=location.hash==='#admin'||location.search.includes('admin');
function render(){let root=document.getElementById('app');let urgentes=ORDENES.filter(o=>o.urg&&!['Colocada','Rechazada'].includes(o.estado));let porLoc={};urgentes.forEach(o=>{if(!porLoc[o.loc])porLoc[o.loc]=[];porLoc[o.loc].push(o);});urgentes.sort((a,b)=>{if(a.prov===b.prov)return a.created-b.created;return a.prov?1:-1;});
let html=`<header class="bg-white border-b sticky top-0 z-30"><div class="max-w-[1200px] mx-auto px-4 py-3 flex items-center justify-between gap-2"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-p rounded-xl flex items-center justify-center text-white font-mont font-bold">VT</div><div><h1 class="font-mont font-bold text-p leading-none">Vidrieria Tucuman <span class="text-s">PRO</span></h1><p class="text-[11px] opacity-60">Sistema de órdenes • m² + urgencias</p></div></div><div class="flex gap-2"><button onclick="vista='ordenes';render()" class="px-3 py-2 rounded-full text-xs font-bold ${vista==='ordenes'?'bg-p text-white':'bg-bg'}">Órdenes</button><button onclick="vista='urgencias';render()" class="px-3 py-2 rounded-full text-xs font-bold ${vista==='urgencias'?'bg-accent text-white':'bg-bg'}">Urgencias (${urgentes.length})</button><button onclick="location.hash='#admin';vista='admin';render()" class="px-3 py-2 rounded-full text-xs bg-ink text-white">/admin</button></div></div></header><main class="max-w-[1200px] mx-auto p-3 md:p-4 grid ${vista==='urgencias'?'grid-cols-1':'grid-cols-1 lg:grid-cols-[220px_1fr]'} gap-4">`;
if(vista==='ordenes'){html+=`<aside class="bg-white rounded-2xl p-3 h-fit sticky top-[70px]"><button onclick="nuevaOrden()" class="w-full bg-p text-white font-mont font-bold py-3 rounded-xl mb-3">+ Nueva orden</button><p class="text-[11px] font-bold tracking-widest opacity-50 mb-2">ESTADOS</p>${['Todos',...ESTADOS].map(e=>`<button onclick="filtroEstado='${e}';render()" class="w-full text-left px-3 py-2 rounded-xl text-sm mb-1 ${filtroEstado===e?'bg-p text-white':'hover:bg-bg'}">${e}</button>`).join('')}<div class="mt-4 p-3 bg-bg rounded-xl text-[11px]"><b>Tip:</b> Todo queda en localStorage. Recargá y sigue ahí (criterio 1).</div></aside><section><div class="grid gap-3">${ORDENES.filter(o=>filtroEstado==='Todos'||o.estado===filtroEstado).sort((a,b)=>b.created-a.created).map(o=>{let total=calcOrden(o);let isColocada=o.estado==='Colocada';return `<div class="bg-white rounded-[18px] p-4 border ${o.urg?'border-accent/50 border-l-4 border-l-accent':''} shadow-sm"><div class="flex justify-between items-start gap-2"><div><div class="flex items-center gap-2"><span class="font-mont font-bold">#${o.id}</span><span class="text-xs px-2 py-1 rounded-full bg-bg">${o.estado}</span>${o.urg?'<span class="text-[10px] px-2 py-1 rounded-full bg-accent text-white font-bold">URGENTE</span>':''}${o.prov?'<span class="text-[10px] px-2 py-1 rounded-full bg-ink text-white">Provisoria hecha</span>':''}</div><p class="font-bold mt-1">${o.cliente} <span class="font-normal opacity-60 text-sm">• ${o.loc}</span></p><p class="text-xs opacity-60">${o.motivo} • ${o.panos.length} paño(s) • Total: $${total.toLocaleString('es-AR')}</p>${o.panos.map(p=>{let c=calcPano(p);return `<div class="text-xs mt-1 bg-bg rounded-lg px-2 py-1 inline-block mr-1">${p.ancho}x${p.alto}cm ${getVidrio(p.tipo).nombre} x${p.cant} = $${c.sub.toLocaleString('es-AR')} (${c.m2Fact.toFixed(2)}m²) ${c.aviso?'<span class="text-accent font-bold">⚠ Conviene templado o laminado</span>':''}</div>`}).join('')}</div><div class="flex flex-col gap-1"><button onclick="editarOrden(${o.id})" class="text-xs px-3 py-2 bg-ink text-white rounded-xl" ${isColocada?'':''}>Abrir</button></div></div></div>`;}).join('')}</div></section>`;}
else if(vista==='urgencias'){html+=`<section class="bg-white rounded-2xl p-4"><h2 class="font-mont font-bold text-lg">Cola de urgencias (solo abiertas, agrupadas por localidad)</h2><p class="text-xs opacity-60 mb-4">Criterio 7: urgente + provisoria al final.</p>${Object.keys(porLoc).length===0?'<p class="opacity-40">Sin urgencias</p>':Object.keys(porLoc).map(loc=>`<div class="mt-4"><h3 class="font-bold bg-bg px-3 py-2 rounded-xl">${loc} (${porLoc[loc].length})</h3><div class="grid gap-2 mt-2">${porLoc[loc].map(o=>`<div class="border rounded-xl p-3 flex justify-between ${o.prov?'opacity-60':''}"><span>#${o.id} ${o.cliente} - ${o.estado} ${o.prov?'(Provisoria)':''}</span><span class="font-bold">$${calcOrden(o).toLocaleString('es-AR')}</span></div>`).join('')}</div></div>`).join('')}</section>`;}
else if(vista==='admin'){html+=`<section class="bg-white rounded-2xl p-5 max-w-[600px]"><h2 class="font-mont font-bold text-xl">/admin</h2><p class="text-sm opacity-70 mb-4">Mínimo facturable (criterio 3) y colocación. Clave: ${CFG.clave}</p><label class="text-xs font-bold">Mínimo facturable m²</label><input id="cfgMin" type="number" step="0.01" value="${CFG.min}" class="w-full border rounded-xl p-3 mt-1 mb-3"><label class="text-xs font-bold">Colocación fija $</label><input id="cfgCol" type="number" value="${CFG.coloc}" class="w-full border rounded-xl p-3 mt-1 mb-3"><button onclick="guardarCfg()" class="bg-p text-white font-bold px-5 py-3 rounded-xl">Guardar</button><button onclick="vista='ordenes';location.hash='';render()" class="ml-2 px-5 py-3 rounded-xl bg-bg">Volver</button><div class="mt-6 p-3 bg-bg rounded-xl text-xs">README: Todo en localStorage. Datos de ejemplo inventados. WhatsApp editable. .ics descargable. Clave en localStorage vt_cfg.</div></section>`;}
html+=`</main>`;
if(editId!==null){let o=ORDENES.find(x=>x.id===editId);let isReadOnly=o.estado==='Colocada';let total=calcOrden({...o,panos:tempPanos.length?tempPanos:o.panos});html+=`<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 overflow-y-auto p-2 md:p-6"><div class="bg-white max-w-[900px] mx-auto rounded-[22px] p-4 md:p-6"><div class="flex justify-between items-center"><h2 class="font-mont font-bold text-xl">#${o.id} ${o.cliente}</h2><button onclick="cerrarModal()" class="w-9 h-9 rounded-full bg-bg">✕</button></div><div class="grid md:grid-cols-2 gap-4 mt-4"><div class="space-y-2"><input id="fCliente" ${isReadOnly?'disabled':''} value="${o.cliente}" placeholder="Cliente" class="w-full border rounded-xl p-3 text-sm"><div class="grid grid-cols-2 gap-2"><input id="fCel" type="tel" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" ${o.cel}" placeholder="Celular" class="border rounded-xl p-3 text-sm"><select id="fLoc" class="border rounded-xl p-3 text-sm">${LOCALIDADES.map(l=>`<option ${l===o.loc?'selected':''}>${l}</option>`).join('')}</select></div><input id="fDir" ${isReadOnly?'disabled':''} value="${o.dir}" placeholder="Dirección" class="w-full border rounded-xl p-3 text-sm"><input id="fMot" ${isReadOnly?'disabled':''} value="${o.motivo}" placeholder="Motivo" class="w-full border rounded-xl p-3 text-sm"><div class="flex gap-3 items-center text-sm"><label class="flex items-center gap-2"><input id="fUrg" type="checkbox" ${o.urg?'checked':''}> Urgente</label><label class="flex items-center gap-2"><input id="fProv" type="checkbox" ${o.prov?'checked':''}> Provisoria hecha</label></div><div class="grid grid-cols-2 gap-2"><input id="fFmed" type="date" value="${o.fMed}" class="border rounded-xl p-3 text-sm"><label class="flex items-center gap-2 text-sm"><input id="fColoc" type="checkbox" ${o.coloc?'checked':''}> Con colocación</label></div><div class="grid grid-cols-2 gap-2"><input id="fDesc" type="number" value="${o.desc}" placeholder="Descuento $" class="border rounded-xl p-3 text-sm"><input id="fNotas" value="${o.notas}" placeholder="Notas" class="border rounded-xl p-3 text-sm"></div><select id="fEstado" class="w-full border rounded-xl p-3 text-sm font-bold">${ESTADOS.map(e=>`<option ${e===o.estado?'selected':''}>${e}</option>`).join('')}</select>${showRechazo?`<div class="p-3 bg-accent/10 rounded-xl"><label class="text-xs font-bold">Motivo rechazo</label><input id="fMotRech" class="w-full border rounded-xl p-2 mt-1 text-sm" value="${o.notas}"></div>`:''}<div class="flex gap-2 mt-2"><button onclick="guardarOrden()" class="flex-1 bg-p text-white font-bold py-3 rounded-xl">Guardar ficha</button><button onclick="yaTengoMedidas()" class="px-3 py-3 bg-bg rounded-xl text-xs">Ya tengo las medidas</button></div><div class="mt-3 p-3 bg-bg rounded-xl"><p class="text-xs font-bold">WhatsApp (editable)</p><textarea id="fWA" class="w-full border rounded-xl p-2 text-sm mt-1" rows="3">Hola ${o.cliente}, tu presupuesto: ${o.panos.length?o.panos.map(p=>`${p.cant} ${getVidrio(p.tipo).nombre} de ${p.ancho} por ${p.alto} cm`).join(', '):'pendiente'}. Total: $ ${total.toLocaleString('es-AR')}</textarea><div class="flex gap-2 mt-2"><button onclick="compartirWA()" class="px-4 py-2 bg-[#25D366] text-white rounded-xl text-sm font-bold">WhatsApp</button><button onclick="descargarICS()" class="px-4 py-2 bg-ink text-white rounded-xl text-sm">.ics medición</button></div></div></div><div><h3 class="font-mont font-bold text-sm">PAÑOS (${(tempPanos.length?tempPanos:o.panos).length})</h3><p class="text-[11px] opacity-60 mb-2">Queda abierto después de guardar. Conserva tipo vidrio.</p><div class="space-y-2 max-h-[320px] overflow-y-auto pr-1">${(tempPanos.length?tempPanos:o.panos).map((p,i)=>{let c=calcPano(p);return `<div class="border rounded-xl p-2 text-xs flex justify-between gap-2 ${c.aviso?'border-accent':''}"><div>${p.ancho}x${p.alto} ${getVidrio(p.tipo).nombre} x${p.cant} - $${c.sub.toLocaleString('es-AR')} (${c.m2Fact.toFixed(2)}m²) ${c.aviso?'<br><b class="text-accent">Conviene templado o laminado para este tamaño</b>':''}</div><button onclick="quitarPano(${i})" class="text-[10px] bg-bg px-2 py-1 rounded-lg">Quitar</button></div>`}).join('')}</div><div class="mt-3 border-t pt-3 ${isReadOnly?'opacity-40 pointer-events-none':''}"><p class="text-xs font-bold mb-2">Agregar paño</p><div class="grid grid-cols-3 gap-2"><input id="pAn" type="number" placeholder="Ancho" value="${tempForm.ancho}" class="border rounded-xl p-2 text-sm"><input id="pAl" type="number" placeholder="Alto" value="${tempForm.alto}" class="border rounded-xl p-2 text-sm"><input id="pCant" type="number" min="1" value="${tempForm.cant}" class="border rounded-xl p-2 text-sm"></div><select id="pTipo" class="w-full border rounded-xl p-2 text-sm mt-2">${VIDRIOS.map(v=>`<option value="${v.id}" ${v.id===tempForm.tipo?'selected':''}>${v.nombre} - $${v.precio.toLocaleString('es-AR')}/m²</option>`).join('')}</select><div class="flex gap-2 mt-2"><button onclick="agregarPano()" class="flex-1 bg-s text-white font-bold py-2.5 rounded-xl">+ Agregar paño</button><span class="text-xs py-2.5">Sub: $<span id="pSub">0</span></span></div><p id="pErr" class="text-xs text-red-600 mt-1"></p></div><div class="mt-4 bg-ink text-white rounded-2xl p-4"><div class="flex justify-between text-sm opacity-80"><span>Suma paños</span><span>$${(tempPanos.length?tempPanos:o.panos).reduce((a,p)=>a+calcPano(p).sub,0).toLocaleString('es-AR')}</span></div><div class="flex justify-between font-mont font-bold text-xl mt-2"><span>TOTAL</span><span>$${total.toLocaleString('es-AR')}</span></div></div></div></div></div></div>`;}
root.innerHTML=html;
setTimeout(()=>{let an=document.getElementById('pAn'),al=document.getElementById('pAl'),cant=document.getElementById('pCant'),tipo=document.getElementById('pTipo');function upd(){if(!an||!al)return;let p={ancho:parseFloat(an.value)||0,alto:parseFloat(al.value)||0,tipo:tipo.value,cant:parseInt(cant.value)||1};if(p.ancho>0&&p.alto>0){let c=calcPano(p);let s=document.getElementById('pSub');if(s)s.innerText=c.sub.toLocaleString('es-AR');}}if(an){['input','change'].forEach(ev=>{an.addEventListener(ev,upd);al.addEventListener(ev,upd);cant.addEventListener(ev,upd);tipo.addEventListener(ev,upd);});upd();}},50);
}
function nuevaOrden(){let id=Math.max(...ORDENES.map(o=>o.id))+1;let o={id,cliente:'',cel:'',loc:LOCALIDADES[0],dir:'',motivo:'',urg:false,prov:false,fMed:'',coloc:false,desc:0,notas:'',estado:'Pedido recibido',panos:[],created:Date.now()};ORDENES.unshift(o);save();editarOrden(id);}
function editarOrden(id){editId=id;tempPanos=[...ORDENES.find(o=>o.id===id).panos];tempForm={tipo:'f4',ancho:'',alto:'',cant:1};render();}
function cerrarModal(){editId=null;tempPanos=[];showRechazo=false;render();}
function agregarPano(){let an=parseFloat(document.getElementById('pAn').value),al=parseFloat(document.getElementById('pAl').value),cant=parseInt(document.getElementById('pCant').value)||1,tipo=document.getElementById('pTipo').value;let err=document.getElementById('pErr');if(!an||!al||an<=0||al<=0||an>500||al>500){err.innerText='Medidas fuera de rango (0-500 cm). No se guarda.';return;}if(cant<=0){err.innerText='Cantidad >=1';return;}err.innerText='';tempForm={tipo,ancho:an,alto:al,cant};tempPanos.push({ancho:an,alto:al,tipo,cant});document.getElementById('pAn').value='';document.getElementById('pAl').value='';render();}
function quitarPano(i){tempPanos.splice(i,1);render();}
function guardarOrden(){let o=ORDENES.find(x=>x.id===editId);o.cliente=document.getElementById('fCliente').value||'Sin nombre';o.cel=document.getElementById('fCel').value;o.loc=document.getElementById('fLoc').value;o.dir=document.getElementById('fDir').value;o.motivo=document.getElementById('fMot').value;o.urg=document.getElementById('fUrg').checked;o.prov=document.getElementById('fProv').checked;o.fMed=document.getElementById('fFmed').value;o.coloc=document.getElementById('fColoc').checked;o.desc=parseFloat(document.getElementById('fDesc').value)||0;o.notas=document.getElementById('fNotas').value;let nuevoEstado=document.getElementById('fEstado').value;if(o.estado==='Presupuestada'&&nuevoEstado==='Aprobada'&&tempPanos.length===0){alert('No se puede pasar de Presupuestada a Aprobada sin al menos un paño cargado');return;}if(nuevoEstado==='Rechazada'){if(!showRechazo){showRechazo=true;render();return;}let mot=document.getElementById('fMotRech')?.value;if(!mot||mot.trim().length<3){alert('Rechazada pide un motivo');return;}o.notas=mot;}o.estado=nuevoEstado;o.panos=[...tempPanos];save();cerrarModal();}
function yaTengoMedidas(){let o=ORDENES.find(x=>x.id===editId);if(o.estado==='Pedido recibido')document.getElementById('fEstado').value='Presupuestada';o.fMed='';}
function compartirWA(){let txt=document.getElementById('fWA').value;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
function descargarICS(){let o=ORDENES.find(x=>x.id===editId);let f=o.fMed||new Date().toISOString().slice(0,10);let dt=f.replace(/-/g,'');let ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${dt}T100000\nDTEND:${dt}T110000\nSUMMARY:Medición vidriería - ${o.cliente}\nLOCATION:${o.loc} ${o.dir}\nDESCRIPTION:${o.motivo}\nEND:VEVENT\nEND:VCALENDAR`;let blob=new Blob([ics],{type:'text/calendar'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`medicion-${o.id}.ics`;a.click();}
function guardarCfg(){CFG.min=parseFloat(document.getElementById('cfgMin').value)||0.25;CFG.coloc=parseFloat(document.getElementById('cfgCol').value)||30000;save();alert('Guardado. Mínimo: '+CFG.min+' m²');vista='ordenes';location.hash='';render();}
window.nuevaOrden=nuevaOrden;window.editarOrden=editarOrden;window.cerrarModal=cerrarModal;window.agregarPano=agregarPano;window.quitarPano=quitarPano;window.guardarOrden=guardarOrden;window.yaTengoMedidas=yaTengoMedidas;window.compartirWA=compartirWA;window.descargarICS=descargarICS;window.guardarCfg=guardarCfg;
render();if(isHashAdmin){vista='admin';render();}
</script>
